<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-light type="ambient" intensity="2"></a-light>

    <a-entity mindar-image-target="targetIndex: 0">

      <!-- TITULO -->
      <a-text
        value="Sistema Solar"
        align="center"
        color="#ffffff"
        width="1.5"
        position="0 0.62 0.1">
      </a-text>

      <!-- ORBITAS -->
      <a-ring radius-inner="0.149" radius-outer="0.151" color="#ffffff" opacity="0.35" position="0 0 0.05"></a-ring>
      <a-ring radius-inner="0.199" radius-outer="0.201" color="#ffffff" opacity="0.35" position="0 0 0.05"></a-ring>
      <a-ring radius-inner="0.249" radius-outer="0.251" color="#ffffff" opacity="0.35" position="0 0 0.05"></a-ring>
      <a-ring radius-inner="0.299" radius-outer="0.301" color="#ffffff" opacity="0.35" position="0 0 0.05"></a-ring>
      <a-ring radius-inner="0.359" radius-outer="0.361" color="#ffffff" opacity="0.35" position="0 0 0.05"></a-ring>
      <a-ring radius-inner="0.409" radius-outer="0.411" color="#ffffff" opacity="0.35" position="0 0 0.05"></a-ring>
      <a-ring radius-inner="0.459" radius-outer="0.461" color="#ffffff" opacity="0.35" position="0 0 0.05"></a-ring>
      <a-ring radius-inner="0.509" radius-outer="0.511" color="#ffffff" opacity="0.35" position="0 0 0.05"></a-ring>

      <!-- MERCURIO -->
      <a-entity
        rotation="0 0 20"
        animation="property: rotation; to: 0 0 380; loop: true; dur: 4000; easing: linear">

        <a-sphere
          radius="0.018"
          color="#9e9e9e"
          position="0.15 0 0.10">
        </a-sphere>
      </a-entity>

      <!-- VENUS -->
      <a-entity
        rotation="0 0 70"
        animation="property: rotation; to: 0 0 430; loop: true; dur: 6000; easing: linear">

        <a-sphere
          radius="0.028"
          color="#e0a96d"
          position="0.20 0 0.10">
        </a-sphere>
      </a-entity>

      <!-- TERRA -->
      <a-entity
        rotation="0 0 130"
        animation="property: rotation; to: 0 0 490; loop: true; dur: 8000; easing: linear">

        <a-sphere
          radius="0.030"
          color="#1976d2"
          position="0.25 0 0.10">
        </a-sphere>
      </a-entity>

      <!-- MARTE -->
      <a-entity
        rotation="0 0 180"
        animation="property: rotation; to: 0 0 540; loop: true; dur: 10000; easing: linear">

        <a-sphere
          radius="0.024"
          color="#c1440e"
          position="0.30 0 0.10">
        </a-sphere>
      </a-entity>

      <!-- JUPITER -->
      <a-entity
        rotation="0 0 220"
        animation="property: rotation; to: 0 0 580; loop: true; dur: 13000; easing: linear">

        <a-sphere
          radius="0.060"
          color="#d39b68"
          position="0.36 0 0.10">
        </a-sphere>
      </a-entity>

      <!-- SATURNO -->
      <a-entity
        rotation="0 0 270"
        animation="property: rotation; to: 0 0 630; loop: true; dur: 16000; easing: linear">

        <a-entity position="0.41 0 0.10">

          <a-sphere
            radius="0.050"
            color="#d8c27a">
          </a-sphere>

          <a-ring
            radius-inner="0.065"
            radius-outer="0.085"
            color="#c7b27c"
            rotation="65 0 0"
            side="double">
          </a-ring>

        </a-entity>
      </a-entity>

      <!-- URANO -->
      <a-entity
        rotation="0 0 310"
        animation="property: rotation; to: 0 0 670; loop: true; dur: 19000; easing: linear">

        <a-sphere
          radius="0.038"
          color="#77d6e6"
          position="0.46 0 0.10">
        </a-sphere>
      </a-entity>

      <!-- NETUNO -->
      <a-entity
        rotation="0 0 350"
        animation="property: rotation; to: 0 0 710; loop: true; dur: 22000; easing: linear">

        <a-sphere
          radius="0.037"
          color="#3155d9"
          position="0.51 0 0.10">
        </a-sphere>
      </a-entity>

    </a-entity>

  </a-scene>

</body>
</html>
